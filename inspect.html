<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GLB inspector</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <pre id="out">loading…</pre>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

      const draco = new DRACOLoader().setDecoderPath("./assets/draco/");
      const loader = new GLTFLoader().setDRACOLoader(draco);

      loader.load("./assets/body.glb", (gltf) => {
        const meshes = [];
        gltf.scene.traverse((o) => {
          if (o.isMesh) meshes.push(o);
        });
        const types = new Map();
        let tris = 0;
        meshes.forEach((m) => {
          const t = (m.userData && (m.userData.type || m.userData.Type)) || "(none)";
          if (!types.has(t)) types.set(t, []);
          types.get(t).push(m.name);
          const g = m.geometry;
          tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
        });
        const box = new THREE.Box3().setFromObject(gltf.scene);
        const report = {
          meshCount: meshes.length,
          triangles: Math.round(tris),
          bbox: { min: box.min.toArray().map((v) => +v.toFixed(3)), max: box.max.toArray().map((v) => +v.toFixed(3)) },
          typeCounts: [...types].map(([k, v]) => [k, v.length]),
          sampleUserData: meshes.slice(0, 3).map((m) => ({ name: m.name, userData: m.userData })),
          materialSample: meshes.slice(0, 5).map((m) => ({
            name: m.name,
            mat: m.material.name,
            color: "#" + m.material.color.getHexString(),
            type: m.material.type,
          })),
          namesByType: Object.fromEntries([...types].map(([k, v]) => [k, v.slice(0, 40)])),
        };
        document.getElementById("out").textContent = JSON.stringify(report, null, 2);
        window.__report = report;
        window.__gltf = gltf;
      }, undefined, (e) => {
        document.getElementById("out").textContent = "ERROR: " + e;
      });
    </script>
  </body>
</html>
